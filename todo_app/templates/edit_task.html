{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}

{% block content %}

<section class="form-page">
    <h2>Edit Task</h2>

    <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="post" class="task-form">
        <div class="form-group">
            <label for="title">Task Title *</label>
            <input type="text" id="title" name="title" value="{{ task['title'] }}" required maxlength="200">
        </div>

        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="4">{{ task['description'] or '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="due_date">Due Date (optional)</label>
            <input type="date" id="due_date" name="due_date" value="{{ task['due_date'] or '' }}">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-link">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
